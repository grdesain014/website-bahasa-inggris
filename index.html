.flip{
  transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.2,.8,.2,1);
  position:relative;
  width:100%;
  height:100%
}

.flip.flipped{
  transform:rotateY(180deg)
}

  inset:0;

  -webkit-backface-visibility:hidden;

}

@keyframes floaty{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-8px)
  }
}

@keyframes drift{
  0%,100%{
    transform:translateX(0)
  }

  50%{
    transform:translateX(22px)
  }
}

@keyframes twinkle{
  0%,100%{
    opacity:.45;
    transform:scale(1)
  }

  50%{
    opacity:1;
    transform:scale(1.18)
  }
}

@keyframes mascot-jump{
  0%{
    transform:translateY(0) scale(1,1)
  }

  30%{
    transform:translateY(-24px) scale(.96,1.05)
  }

  55%{
    transform:translateY(0) scale(1.06,.94)
  }

  75%{
    transform:translateY(-10px) scale(1,1)
  }

  100%{
    transform:translateY(0) scale(1,1)
  }
}

@keyframes balloon-bob{
  0%,100%{
    transform:translateY(0) rotate(-2deg)
  }

  50%{
    transform:translateY(-10px) rotate(2deg)
  }
}

@keyframes toy-wiggle{
  0%,100%{
    transform:translateY(-6px) rotate(-1deg)
  }

  50%{
    transform:translateY(-6px) rotate(1deg)
  }
}

@keyframes confetti-fall{
  0%{
    transform:translateY(-12px) rotate(0deg);
    opacity:0
  }

  18%{
    opacity:1
  }

  100%{
    transform:translateY(180px) rotate(180deg);
    opacity:0
  }
}

@keyframes gentle-bounce{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-6px)
  }
}

.cloud-slow{
  animation:drift 16s ease-in-out infinite
}

.cloud-slower{
  animation:drift 22s ease-in-out infinite reverse
}

.star-twinkle{
  animation:twinkle 3.4s ease-in-out infinite
}

.mascot-jump{
  animation:mascot-jump .65s ease
}

.balloon-bob{
  animation:balloon-bob 5s ease-in-out infinite
}

.toy-card{
  transition:transform .25s ease, box-shadow .25s ease
}

.toy-card:hover{
  transform:translateY(-6px);
  animation:toy-wiggle 1.6s ease-in-out infinite
}

.toy-card:active{
  transform:translateY(-2px) scale(.99)
}

.confetti-soft{
  animation:confetti-fall 3.2s ease-in infinite
}

.gentle-bounce{
  animation:gentle-bounce 2.4s ease-in-out infinite
}

@media (prefers-reduced-motion: reduce){
  .cloud-slow,.cloud-slower,.star-twinkle,.balloon-bob,.floaty,.toy-card:hover,.confetti-soft,.gentle-bounce{
    animation:none
  }

  .mascot-jump{
    animation:none
  }

  .toy-card:hover{
    transform:translateY(-3px)
  }
}

@keyframes pop{
  from{
    opacity:0;
    transform:translateY(14px) scale(.98)
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1)
  }
}

/* Pointer follower — desktop only. The layer never receives pointer events. */

.pointer-fx{
  position:fixed;
  inset:0;
  z-index:70;
  pointer-events:none;
  overflow:hidden
}

.cursor-follower{
  position:fixed;
  left:0;
  top:0;
  width:44px;
  height:44px;
  will-change:transform;
  transition:opacity .25s ease;
  pointer-events:none
}

.cursor-follower span{
  display:grid;
  place-items:center;
  width:100%;
  height:100%;
  background:#FFF7CC;
  border:2px solid #F59E0B;
  border-radius:999px;
  box-shadow:0 8px 20px rgba(245,158,11,.35);
  font-size:22px;
  line-height:1
}

.pointer-particle{
  position:fixed;
  pointer-events:none;
  transform:translate(-50%,-50%);
  text-shadow:0 2px 6px rgba(16,42,67,.18);
  animation:pointer-sparkle .72s ease-out forwards;
  will-change:transform,opacity
}

@keyframes pointer-sparkle{
  0%{
    opacity:.95;
    transform:translate(-50%,-50%) scale(.6) rotate(0deg)
  }

  100%{
    opacity:0;
    transform:translate(calc(-50% + var(--drift,0px)),-46px) scale(1.25) rotate(45deg)
  }
}

@media (pointer: fine){
  .toy-card:hover{
    box-shadow:0 16px 30px rgba(37,99,235,.16),0 0 0 3px rgba(250,204,21,.55)
  }

  button:hover{
    filter:brightness(1.03)
  }
}

@media (pointer: coarse), (max-width: 768px){
  .pointer-fx,.cursor-follower,.pointer-particle{
    display:none !important
  }
}

  .pointer-fx{
    display:none !important
  }
}
